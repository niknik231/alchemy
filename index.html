<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>⚗️ Алхимия</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚗️</text></svg>">
<!-- region: STYLES -->
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(1200px 800px at 70% -10%, #3b2f63 0%, transparent 60%),
    radial-gradient(900px 700px at 10% 110%, #14343f 0%, transparent 55%),
    linear-gradient(160deg,#12101f,#1c1830 60%,#151222);
  color:#eceaf6;height:100%;display:flex;flex-direction:column;overflow:hidden;
  user-select:none;-webkit-user-select:none
}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);flex-wrap:wrap}
header h1{font-size:19px;font-weight:600;margin-right:auto;display:flex;align-items:center;gap:10px}
#counter{font-size:13px;color:#a9a4c6;background:rgba(255,255,255,.06);padding:3px 10px;border-radius:999px;font-weight:400}
button{font:inherit;color:inherit;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:6px 12px;border-radius:10px;cursor:pointer;transition:.15s}
button:hover{background:rgba(255,255,255,.15)}
button:active{transform:scale(.96)}
.menu-wrap{position:relative;flex:none}
.menu-trigger{height:35px;min-width:40px;padding:6px 10px;font-size:20px;line-height:1}
.app-menu{position:absolute;top:calc(100% + 8px);right:0;width:min(280px,calc(100vw - 20px));display:none;padding:14px;background:rgba(24,21,44,.98);border:1px solid rgba(255,255,255,.16);border-radius:14px;box-shadow:0 16px 38px rgba(0,0,0,.48);z-index:900}
.app-menu.open{display:block;animation:menuIn .16s ease-out}
@keyframes menuIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.menu-title{font-size:16px;font-weight:700;color:#f2efff;margin-bottom:6px}
.menu-about{font-size:12px;line-height:1.45;color:#aaa5c4;margin-bottom:10px}
.menu-version{font-size:11px;color:#817b9e;padding-top:9px;border-top:1px solid rgba(255,255,255,.08)}
.app-menu .menu-link{width:100%;margin:2px 0 12px;display:flex;align-items:center;gap:8px;text-align:left}
.app-menu #btnReset{width:100%;margin-top:12px;color:#ffc7c7;background:rgba(210,71,71,.12);border-color:rgba(255,112,112,.25)}
.app-menu #btnReset:hover{background:rgba(210,71,71,.24)}
.game-icon{display:inline-block;width:1em;height:1em;vertical-align:-.14em;overflow:visible}
.scene-icon{filter:drop-shadow(0 2px 2px rgba(0,0,0,.42))}
main{flex:1;display:flex;min-height:0}
aside{width:236px;padding:10px;overflow-y:auto;border-right:1px solid rgba(255,255,255,.07)}
aside h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#8f89ad;margin:2px 2px 8px}
#palette{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:64px;height:64px;border-radius:14px;cursor:grab;touch-action:none;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12);transition:.15s}
.chip:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.32)}
.chip .em{font-size:26px;line-height:1}
.chip .nm{font-size:10px;color:#cfcbe6;text-align:center;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recipe-count{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:9px;font-weight:700;line-height:1;color:#d9d5ea;background:#302b49;border:1px solid rgba(255,255,255,.2);box-shadow:0 2px 7px rgba(0,0,0,.35)}
.chip.new{animation:newGlow 2.2s ease-out}
@keyframes newGlow{0%{box-shadow:0 0 0 2px rgba(255,215,0,.9),0 0 26px rgba(255,215,0,.6)}100%{box-shadow:none}}
#board{flex:1;position:relative;overflow:hidden}
.item{position:absolute;width:76px;height:76px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:grab;touch-action:none;z-index:1;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(0,0,0,.35);animation:pop .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.item.dragging{cursor:grabbing;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.item.consumed{pointer-events:none;animation:consume .28s ease-in forwards !important}
@keyframes consume{to{transform:scale(.05) rotate(120deg);opacity:0;filter:blur(5px)}}
.item .em{font-size:30px;line-height:1}
.item .nm{font-size:10px;color:#ddd9f0;text-align:center;max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shake{animation:shake .35s !important}
@keyframes shake{0%,100%{translate:0 0}20%,60%{translate:-6px 0}40%,80%{translate:6px 0}}
.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.85;transform:translate(-50%,-50%);animation:none !important}
.spark{position:fixed;z-index:998;pointer-events:none;font-size:18px;animation:fly .6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#hintbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);box-sizing:border-box;width:max-content;max-width:calc(100% - 32px);background:rgba(22,19,42,.96);border:1px solid rgba(255,255,255,.16);padding:9px 18px;border-radius:12px;font-size:14px;line-height:1.35;opacity:0;pointer-events:none;transition:.3s;text-align:center;white-space:normal;overflow-wrap:anywhere;z-index:450}
#hintbar.show{opacity:1}
#hintbar .hint-pick{display:inline-flex;align-items:center;gap:5px}
#hintbar .hint-pick .game-icon{font-size:18px}
#blackHole{position:absolute;right:18px;bottom:18px;width:76px;height:76px;display:grid;place-items:center;border-radius:50%;z-index:400;pointer-events:none;font-size:42px;line-height:1;background:radial-gradient(circle at 50% 48%,#000 0 34%,#171124 40%,#7554a8 55%,rgba(108,75,158,.18) 69%,transparent 72%);filter:drop-shadow(0 0 9px rgba(152,105,220,.45));transition:transform .16s,filter .16s}
#blackHole::after{content:"";position:absolute;inset:5px;border:2px solid rgba(207,176,255,.3);border-radius:50%;transform:rotate(-18deg) scaleY(.48)}
#blackHole.ready{transform:scale(1.16) rotate(8deg);filter:drop-shadow(0 0 18px rgba(190,139,255,.9))}
#popup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:.25s;z-index:1000}
#popup.show{opacity:1}
#popup .card{background:rgba(24,21,44,.96);border:1px solid rgba(255,215,0,.45);border-radius:20px;padding:24px 44px;text-align:center;box-shadow:0 0 60px rgba(255,215,0,.25);transform:scale(.75) translateY(10px);transition:.25s cubic-bezier(.34,1.56,.64,1)}
#popup.show .card{transform:scale(1) translateY(0)}
#popup .big{font-size:62px;line-height:1.15}
#popup .big .game-icon{width:1em;height:1em}
#popup .ttl{color:#ffd75e;font-weight:700;margin-top:4px}
#popup .val{font-size:20px;margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(8,6,18,.72);display:none;align-items:center;justify-content:center;z-index:500}
.modal.open{display:flex}
.sheet{width:min(600px,94vw);max-height:84vh;display:flex;flex-direction:column;background:#191631;border:1px solid rgba(255,255,255,.14);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55);animation:pop .22s cubic-bezier(.34,1.56,.64,1)}
.sheet-head{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sheet-head h2{font-size:15px;margin-right:auto}
#codexSearch{flex:0 1 220px;font:inherit;font-size:13px;color:inherit;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:6px 10px;outline:none}
#codexSearch:focus{border-color:rgba(255,215,0,.5)}
.codex-modes{display:flex;gap:6px;padding:8px 12px 0}
.codex-mode{flex:1;padding:6px 10px;font-size:12px;color:#aaa5c4;background:rgba(255,255,255,.04)}
.codex-mode.active{color:#f1edff;background:rgba(137,108,207,.24);border-color:rgba(190,160,255,.38)}
.codex-filter{display:flex;align-items:center;gap:8px;margin:8px 12px 0;padding:7px 10px;border-radius:10px;color:#c8c3da;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:12px;cursor:pointer}
.codex-filter[hidden]{display:none}
.codex-filter input{accent-color:#8b6bc4}
#codexList{overflow-y:auto;padding:8px}
.chain-sheet{width:min(520px,94vw)}
.chain-body{padding:16px;overflow-y:auto}
.chain-intro{font-size:13px;line-height:1.5;color:#b9b4cd;margin-bottom:14px}
.chain-progress{height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:16px}
.chain-progress > span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#7a5bb7,#ffd75e);transition:width .3s ease}
.chain-steps{display:flex;flex-direction:column;gap:8px}
.chain-step{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:54px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
.chain-step .chain-icon{font-size:24px;line-height:1;text-align:center}
.chain-step .chain-copy{min-width:0;display:flex;flex-direction:column;gap:2px}
.chain-step .chain-label{font-size:11px;color:#8f89ad}
.chain-step .chain-name{font-size:14px;color:#ddd9ed;overflow-wrap:anywhere}
.chain-step .chain-state{font-size:16px;color:#77718e}
.chain-step.done{border-color:rgba(129,199,132,.24);background:rgba(82,150,87,.09)}
.chain-step.done .chain-state{color:#81c784}
.chain-step.current{border-color:rgba(255,215,94,.38);background:rgba(255,215,94,.08);box-shadow:0 0 18px rgba(255,215,94,.06)}
.chain-step.current .chain-label,.chain-step.current .chain-state{color:#ffd75e}
.chain-step.locked .chain-icon,.chain-step.locked .chain-name{color:#77718e}
.chain-actions{display:flex;justify-content:flex-end;margin-top:14px}
.chain-actions button{color:#f3e8b0;border-color:rgba(255,215,94,.3);background:rgba(255,215,94,.09)}
.chain-empty{text-align:center;padding:22px 10px;color:#aaa5c4;font-size:13px;line-height:1.5}
.settings-sheet{width:min(500px,94vw)}
.settings-body{padding:14px}
.setting-row{display:flex;align-items:center;gap:16px;padding:14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);cursor:pointer}
.setting-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:4px}
.setting-copy strong{font-size:14px;color:#f0edf9}
.setting-copy small{font-size:12px;line-height:1.4;color:#aaa5c4}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.switch-track{position:absolute;inset:0;border-radius:999px;background:#39354d;border:1px solid rgba(255,255,255,.15);transition:.18s}
.switch-track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#bbb6ca;box-shadow:0 2px 5px rgba(0,0,0,.35);transition:.18s}
.switch input:checked + .switch-track{background:#7256aa;border-color:#aa8ee0}
.switch input:checked + .switch-track::after{transform:translateX(20px);background:#fff}
.switch input:focus-visible + .switch-track{outline:2px solid #d3b8ff;outline-offset:2px}
.palette-empty{padding:10px 4px;color:#8f89ad;font-size:12px;line-height:1.4}
.crow{position:relative;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px}
.crow:nth-child(even){background:rgba(255,255,255,.04)}
.crow .em{font-size:22px;width:30px;text-align:center;flex:none;line-height:1}
.crow .nm{font-size:14px;width:160px;flex:none;display:flex;align-items:center;gap:6px}
.crow .nm .recipe-count{position:static;display:inline-flex;flex:none;box-shadow:none}
.codex-star{flex:none;color:#ffd75e;font-size:14px;line-height:1;text-shadow:0 1px 4px rgba(0,0,0,.75)}
.crow.unknown .nm{color:#8f89ad}
.crow.undiscovered{cursor:pointer}
.crow.undiscovered:hover{background:rgba(255,255,255,.075)}
.crow.undiscovered:focus-visible{outline:2px solid #d3b8ff;outline-offset:-2px}
.crow.undiscovered .nm{color:#d4cfea}
.crow .rc{font-size:12px;color:#a9a4c6;margin-left:auto;text-align:right}
.crow.undiscovered.has-clue{align-items:flex-start;flex-wrap:wrap}
.element-clue{display:none;flex-basis:calc(100% - 42px);margin:-4px 0 2px 42px;padding:6px 9px;border-left:2px solid rgba(255,215,94,.45);font-size:11.5px;line-height:1.4;color:#bbb5d2;font-style:italic}
.crow.undiscovered.clue-open .element-clue{display:block}
.element-clue strong{color:#e7cf7b;font-style:normal;font-weight:600}
.recipe-unknown{color:#ffd75e;font-weight:700;letter-spacing:.08em}
.cat-h{flex-basis:100%;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8f89ad;margin:12px 2px 6px;display:flex;align-items:center;gap:6px}
aside h2 + .hidefin + .cat-h{margin-top:4px}
.cat-h:first-child{margin-top:2px}
.cat-h .dot{width:8px;height:8px;border-radius:50%;flex:none}
.cat-h .cnt{margin-left:auto;font-size:10px;letter-spacing:0;text-transform:none}
.chip.final,.item.final{filter:saturate(.55) brightness(.82)}
.item.final::after,.chip.final::after{content:"✦";position:absolute;top:-5px;right:-5px;font-size:12px;color:#ffd75e;text-shadow:0 1px 4px rgba(0,0,0,.9)}
#tip .f{color:#ffd75e;margin-top:3px;font-weight:600}
.cbtn{flex:none;width:26px;height:26px;padding:0;border-radius:8px;font-size:17px;line-height:1;color:#ffd75e;background:rgba(255,215,0,.10);border:1px solid rgba(255,215,0,.35)}
.cbtn:hover{background:rgba(255,215,0,.28)}
#tip{position:fixed;z-index:600;pointer-events:none;transform:translate(-50%,-100%);background:rgba(22,19,42,.96);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:7px 12px;font-size:12.5px;color:#e8e5f5;opacity:0;transition:opacity .12s;white-space:nowrap}
#tip.show{opacity:1}
#tip .t{color:#ffd75e;font-weight:600;margin-bottom:2px}
@media(max-width:640px){
  header{gap:6px;padding:8px 10px;flex-wrap:nowrap}
  header h1{font-size:17px;gap:7px;white-space:nowrap}
  #counter{font-size:12px;padding:3px 8px}
  header > button,.menu-trigger{width:34px;min-width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:18px;flex:none}
  header > button .btn-label,.menu-trigger .btn-label{display:none}
  main{flex-direction:column-reverse}
  aside{width:100%;height:158px;border-right:none;border-top:1px solid rgba(255,255,255,.07)}
  .chip{width:54px;height:54px;border-radius:12px}
  .chip .em{font-size:22px}.chip .nm{font-size:9px;max-width:50px}
  .recipe-count{min-width:16px;height:16px;padding:0 4px;font-size:8px}
  .item{width:56px;height:56px;border-radius:13px}.item .em{font-size:22px}.item .nm{font-size:9px;max-width:52px}
  #hintbar{bottom:82px;width:calc(100% - 24px);max-width:none;padding:8px 12px;font-size:12px}
  #blackHole{width:64px;height:64px;right:12px;bottom:12px;font-size:36px}
  .sheet{width:calc(100vw - 16px);max-height:calc(100dvh - 24px);border-radius:14px}
  .sheet-head{gap:8px;padding:10px}
  .sheet-head h2{font-size:14px;white-space:nowrap}
  #codexSearch{flex:1 1 auto;min-width:0;width:auto}
  #btnCodexClose{width:40px;min-width:40px;height:40px;padding:0}
  .codex-modes{padding:8px 8px 0}
  .codex-filter{margin:8px 8px 0}
  #codexList{padding:6px;overscroll-behavior:contain}
  .crow{display:grid;width:100%;min-width:0;overflow:hidden;grid-template-columns:30px minmax(0,1fr) minmax(26px,max-content);grid-template-rows:auto auto;column-gap:8px;row-gap:5px;align-items:start;padding:10px 8px}
  .crow .em{grid-column:1;grid-row:1 / span 2;width:30px;align-self:start}
  .crow .nm{grid-column:2;grid-row:1;width:auto;min-width:0;max-width:100%;line-height:1.25;white-space:normal;overflow-wrap:anywhere}
  .crow .rc{grid-column:2;grid-row:2;min-width:0;max-width:100%;margin:0;text-align:left;line-height:1.35;white-space:normal;overflow-wrap:anywhere;word-break:normal;hyphens:auto}
  .crow .cbtn{grid-column:3;grid-row:2;align-self:end;justify-self:end}
  .crow > .recipe-count{position:static;grid-column:3;grid-row:1;align-self:start;justify-self:end;transform:none}
  .crow.unknown .rc,.crow.undiscovered .rc{grid-column:2 / -1}
  .crow.undiscovered.has-clue{align-items:start}
  .crow .element-clue{grid-column:2 / -1;grid-row:3;width:auto;margin:0;padding:7px 9px}
}
@media(max-width:380px){
  .sheet{width:calc(100vw - 10px)}
  .sheet-head{padding:8px}
  .crow{grid-template-columns:28px minmax(0,1fr) minmax(26px,max-content);column-gap:6px;padding:9px 6px}
  .crow .em{width:28px;font-size:21px}
  .crow .rc{font-size:11.5px}
}
</style>
</head>
<!-- region: UI_SHELL -->
<body>
<header>
  <h1>⚗️ Алхимия <span id="counter"></span></h1>
  <button id="btnCodex" title="Справочник всех элементов" aria-label="Справочник"><span aria-hidden="true">📖</span><span class="btn-label">Справочник</span></button>
  <button id="btnHint" title="Показать возможное сочетание" aria-label="Подсказка"><span aria-hidden="true">💡</span><span class="btn-label">Подсказка</span></button>
  <button id="btnChain" title="Цепочка открытий" aria-label="Цепочка открытий"><span aria-hidden="true">🧭</span><span class="btn-label">Цепочка</span></button>
  <button id="btnClear" title="Убрать всё с поля" aria-label="Очистить поле"><span aria-hidden="true">🧹</span><span class="btn-label">Поле</span></button>
  <div class="menu-wrap" id="menuWrap">
    <button id="btnMenu" class="menu-trigger" title="Меню" aria-label="Открыть меню" aria-expanded="false" aria-controls="appMenu"><span aria-hidden="true">☰</span><span class="btn-label">Меню</span></button>
    <div class="app-menu" id="appMenu" role="dialog" aria-label="Меню программы">
      <div class="menu-title">⚗️ Алхимия</div>
      <div class="menu-about">Игра о создании новых элементов из сочетаний уже открытых. Прогресс хранится только на этом устройстве.</div>
      <button id="btnSettings" class="menu-link" type="button">⚙️ Настройки</button>
      <div class="menu-version">Версия <span id="appVersion"></span></div>
      <button id="btnReset" title="Начать игру заново">🔄 Сбросить прогресс</button>
    </div>
  </div>
</header>
<main>
  <aside><h2>Открытые элементы</h2><div id="palette"></div></aside>
  <section id="board"><div id="hintbar"></div><div id="blackHole" role="img" aria-label="Чёрная дыра — удалить элемент" title="Перетащи сюда элемент, чтобы удалить">🕳️</div></section>
</main>
<div class="modal" id="codex">
  <div class="sheet">
    <div class="sheet-head">
      <h2>📖 Справочник</h2>
      <input id="codexSearch" type="text" placeholder="Поиск..." autocomplete="off">
      <button id="btnCodexClose" title="Закрыть">✕</button>
    </div>
    <div class="codex-modes" id="codexModes" role="tablist" aria-label="Режим справочника">
      <button class="codex-mode active" type="button" role="tab" aria-selected="true" data-mode="all">Все элементы</button>
      <button class="codex-mode" type="button" role="tab" aria-selected="false" data-mode="undiscovered">Неоткрытые</button>
    </div>
    <label class="codex-filter" id="codexAvailableFilter" for="codexShowAvailable">
      <input id="codexShowAvailable" type="checkbox">
      <span>Показать доступные</span>
    </label>
    <div id="codexList"></div>
  </div>
</div>
<div class="modal" id="chainModal">
  <div class="sheet chain-sheet" role="dialog" aria-modal="true" aria-labelledby="chainTitle">

function elementClue(id){
  const clue = ELEMENT_CLUES[id];
  if (!clue) throw new Error(`Не задан авторский намёк для элемента: ${id}`);
  return clue;
}

function normalizeClueWords(value){
  return value.toLocaleLowerCase("ru").replace(/ё/g, "е").match(/[а-яa-z0-9]+/g) || [];
}

function clueContainsName(clue, name){
  const clueWords = normalizeClueWords(clue);
  const nameWords = normalizeClueWords(name);
  return nameWords.length > 0 && clueWords.some((candidate, clueIndex) =>
    candidate === nameWords[0] &&
    nameWords.every((part, offset) => clueWords[clueIndex + offset] === part)
  );
}

function validateElementClues(){
  const elementIds = Object.keys(E);
  const clueIds = Object.keys(ELEMENT_CLUES);
  const missing = elementIds.filter(id => !ELEMENT_CLUES[id]?.trim());
  const extra = clueIds.filter(id => !E[id]);
  const duplicateTexts = clueIds.filter((id, index) =>
    clueIds.findIndex(otherId => ELEMENT_CLUES[otherId] === ELEMENT_CLUES[id]) !== index
  );
  const forbiddenNames = [];
  for (const id of elementIds){
    const ingredientNames = R
      .filter(([, result]) => result === id)
      .flatMap(([raw]) => raw.split(" "))
      .map(component => E[component][0]);
    const categoryNames = CATS.map(([, name]) => name);
    for (const name of [...ingredientNames, ...categoryNames]){
      if (clueContainsName(ELEMENT_CLUES[id] || "", name)) forbiddenNames.push(`${id}: ${name}`);
    }
  }
  if (missing.length || extra.length || duplicateTexts.length || forbiddenNames.length){
    throw new Error(`Некорректные намёки: missing=${missing.join(",")}; extra=${extra.join(",")}; duplicates=${duplicateTexts.join(",")}; forbidden=${forbiddenNames.join(",")}`);
  }
}

const clampPos = v => Math.max(4, Math.min(v, 99999));
const save = () => localStorage.setItem("alchemy.discovered", JSON.stringify([...discovered]));
const saveRecipes = () => localStorage.setItem(DISCOVERED_RECIPES_KEY, JSON.stringify([...discoveredRecipes]));
const saveSettings = () => localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
const saveDiscoveryChain = () => localStorage.setItem(DISCOVERY_CHAIN_KEY,

function iconHTML(id){
  if (ICONS[id]) return ICONS[id];
  return FULL_ICONS[id] || E[id][1];
}

function chipHTML(id){
  return `<span class="em">${iconHTML(id)}</span><span class="nm">${E[id][0]}</span>`;
}

function recipeProgress(id){
  const recipes = RECIPES_USING.get(id) || [];
  return [recipes.filter(recipe => discoveredRecipes.has(recipe)).length, recipes.length];
}

function recipeCountHTML(id){
  if (FINAL.has(id)) return "";
  const [knownRecipes, totalRecipes] = recipeProgress(id);
  const remainingRecipes = totalRecipes - knownRecipes;
  return remainingRecipes > 0
    ? `<span class="recipe-count" aria-label="Осталось открыть рецептов: ${remainingRecipes}">${remainingRecipes}</span>`
    : "";
}

function refreshBoardRecipeCounts(){
  for (const it of items){
    it.el.querySelector(".recipe-count")?.remove();
    it.el.insertAdjacentHTML("beforeend", recipeCountHTML(it.id));
  }
}

// region: BOARD
function renderPalette(){
  palette.innerHTML = "";
  let shown = 0;
  for (const [cid, cname, ids] of CATS){
    const open = ids.filter(id => discovered.has(id));
    const visible = settings.showUnavailableElements
      ? open
      : open.filter(id => {
          const [knownRecipes, totalRecipes] = recipeProgress(id);
          return !FINAL.has(id) && totalRecipes - knownRecipes > 0;
        });
    if (!visible.length) continue;
    const h = document.createElement("div");
    h.className = "cat-h";
    h.innerHTML = `<span class="dot" style="background:${CAT_COLOR[cid]}"></span>${cname}` +
      `<span class="cnt">${open.length}/${ids.length}</span>`;
    palette.appendChild(h);
    for (const id of visible){
      const c = document.createElement("div");
      c.className = "chip" + (id === lastDiscovered ? " new" : "") + (FINAL.has(id) ? " final" : "");
      c.dataset.id = id;
      const [knownRecipes, totalRecipes] = recipeProgress(id);
      const remainingRecipes = totalRecipes - knownRecipes;
      c.title = E[id][0] + (FINAL.has(id) ? " ✦ конечный элемент" : "") +
        (FINAL.has(id) ? "" : remainingRecipes > 0
          ? ` • осталось открыть рецептов: ${remainingRecipes}`
          : " • все рецепты открыты");
      c.innerHTML = chipHTML(id) + recipeCountHTML(id);
      palette.appendChild(c);
      shown++;
    }
  }
  if (!shown){
    const empty = document.createElement("div");
    empty.className = "palette-empty";
    empty.textContent = "Нет открытых элементов с неоткрытыми рецептами.";
    palette.appendChild(empty);
  }
  counter.textContent = `${discovered.size} / ${TOTAL}`;
  refreshBoardRecipeCounts();
}

function addItem(id, x, y){
  const size = itemSize();
  const el = document.createElement("div");
  el.className = "item" + (FINAL.has(id) ? " final" : "");
  el.innerHTML = chipHTML(id) + recipeCountHTML(id);
  el.style.zIndex = ++zTop;
  const it = { id, x: clampPos(x), y: clampPos(y), el };
  it.x = Math.min(it.x, board.clientWidth  - size - 4);
  it.y = Math.min(it.y, board.clientHeight - size - 4);
  el.style.left = it.x + "px";
  el.style.top  = it.y + "px";
  board.appendChild(el);
  items.push(it);
  return it;
}

function removeItem(it){
  const i = items.indexOf(it);
  if (i !== -1) items.splice(i, 1);
  it.el.remove();
  hideTip();
}

function isOverBlackHole(clientX, clientY){
  const r = blackHole.getBoundingClientRect();
  return clientX >= r.left && clientX <= r.right &&
         clientY >= r.top  && clientY <= r.bottom;
}

function consumeItem(it){
  it.el.classList.remove("dragging");
  it.el.classList.add("consumed");
  setTimeout(() => removeItem(it), 280);
}

function sparks(x, y){                       // координаты внутри поля
  const b = board.getBoundingClientRect();
  for (let i = 0; i < 10; i++){
    const s = document.createElement("span");
    s.className = "spark";
    s.textContent = "✦✧✨"[i % 3];
    s.style.left = (b.left + x) + "px";
    s.style.top  = (b.top  + y) + "px";
    const a = Math.random() * Math.PI * 2, d = 45 + Math.random() * 55;
    s.style.setProperty("--dx", Math.cos(a)*d + "px");
    s.style.setProperty("--dy", Math.sin(a)*d + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 650);
  }
}

// Детерминированное заполнение подсказки: прежние доступные варианты сохраняются,
// а открытый элемент заменяется только одним новым.
function strHash(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// region: DISCOVERY_CHAIN
// ---------- Цепочки открытий ----------
// Маршрут строится только из ещё не открытых результатов. Первый этап уже
// достижим, а каждый следующий использует предыдущий результат как компонент.
function createDiscoveryChain(){
  const unseen = new Set(Object.keys(E).filter(id => !discovered.has(id)));
  if (!unseen.size) return [];

  const seed = strHash([...discovered].sort().join("|") + ":discovery-chain");
  const rank = new Map(Object.keys(E).map((id, index) =>
    [id, strHash(`${seed}:${id}:${index}`)]));
  const starts = [...new Set(R
    .filter(([raw, result]) => unseen.has(result) &&
      raw.split(" ").every(component => discovered.has(component)))
    .map(([, result]) => result))]
    .sort((a, b) => rank.get(a) - rank.get(b));

  let best = [];
  function walk(path){
    if (path.length > best.length) best = path.slice();
    if (path.length >= 4) return true;
    const current = path[path.length - 1];
    const next = [...new Set(R
      .filter(([raw, result]) => {
        const components = raw.split(" ");
        return unseen.has(result) && !path.includes(result) && components.includes(current) &&
          components.every(component => discovered.has(component) || path.includes(component));
      })
      .map(([, result]) => result))]
      .sort((a, b) => rank.get(a) - rank.get(b));
    for (const id of next){
      if (walk([...path, id])) return true;
    }
    return false;
  }

  for (const start of starts){
    if (walk([start]) && best.length >= 4) break;
  }
  return best.length >= 2 ? best : [];
}

function chainCompletedCount(){
  return discoveryChain.filter(id => discovered.has(id)).length;
}

function updateChainButton(){
  if (!discoveryChain.length){
    btnChain.title = "Цепочка открытий — подходящий маршрут пока не найден";
    btnChain.setAttribute("aria-label", "Цепочка открытий");
    return;
  }
  const progress = `${chainCompletedCount()} из ${discoveryChain.length}`;
  btnChain.title = `Цепочка открытий — ${progress}`;
  btnChain.setAttribute("aria-label", `Цепочка открытий, выполнено ${progress}`);
}

function renderDiscoveryChain(){
  updateChainButton();
  if (!discoveryChain.length){
    chainBody.innerHTML =
      `<div class="chain-empty">Сейчас из доступных открытий нельзя составить последовательный маршрут. Продолжай экспериментировать — новая цепочка появится вместе с новыми возможностями.</div>` +
      `<div class="chain-actions"><button type="button" data-chain-action="new">Проверить снова</button></div>`;
    return;
  }

  const completed = chainCompletedCount();
  const currentIndex = discoveryChain.findIndex(id => !discovered.has(id));
  const complete = currentIndex === -1;
  const steps = discoveryChain.map((id, index) => {
    const done = discovered.has(id);
    const current = !complete && index === currentIndex;
    const state = done ? "done" : current ? "current" : "locked";
    const icon = done || current ? iconHTML(id) : "❔";
    const name = done || current ? E[id][0] : "Скрытый этап";
    const label = done ? `Этап ${index + 1} завершён` : current ? `Этап ${index + 1} — текущая цель` : `Этап ${index + 1}`;
    const mark = done ? "✓" : current ? "◆" : "•";
    return `<div class="chain-step ${state}">` +
      `<div class="chain-icon">${icon}</div>` +
      `<div class="chain-copy"><span class="chain-label">${label}</span><span class="chain-name">${name}</span></div>` +
      `<span class="chain-state" aria-hidden="true">${mark}</span></div>`;
  }).join("");
  const intro = complete
    ? "Цепочка завершена. Можно отправиться по новому маршруту."
    : "Открой текущую цель обычным сочетанием. Следующий этап проявится после открытия.";
  chainBody.innerHTML =
    `<div class="chain-intro">${intro}</div>` +
    `<div class="chain-progress" aria-label="Выполнено ${completed} из ${discoveryChain.length}"><span style="width:${completed / discoveryChain.length * 100}%"></span></div>` +
    `<div class="chain-steps">${steps}</div>` +
    (complete ? `<div class="chain-actions"><button type="button" data-chain-action="new">Новая цепочка</button></div>` : "");
}

function startNewDiscoveryChain(){
  discoveryChain = createDiscoveryChain();
  saveDiscoveryChain();
  renderDiscoveryChain();
}

function registerChainDiscovery(id){
  if (!discoveryChain.includes(id)) return;
  const complete = discoveryChain.every(chainId => discovered.has(chainId));
  renderDiscoveryChain();
  if (complete){
    setTimeout(() => showPopup("🧭", "Цепочка завершена!", "Открой новую экспедицию"), 2050);
  }
}

function openDiscoveryChain(){
  renderDiscoveryChain();
  chainModal.classList.add("open");
  document.getElementById("btnChainClose").focus();
}
function closeDiscoveryChain(){ chainModal.classList.remove("open"); }

function showHint(){
  const options = [...new Set(R
    .filter(([k,res]) => {
      const [a,b] = k.split(" ");
      return discovered.has(a) && discovered.has(b) && !discovered.has(res);
    })
    .map(([,res]) => res))];
  if (!options.length){
    hintPicks = [];
    notify(discovered.size === TOTAL
      ? "🎉 Все элементы открыты!"
      : "Подсказок нет — новые элементы из открытых пока не получить!", 4500);
    return;
  }
  const available = new Set(options);
  hintPicks = hintPicks.filter(id => !discovered.has(id) && available.has(id));
  const remaining = options.filter(id => !hintPicks.includes(id));
  const rnd = mulberry32(strHash([...discovered].sort().join("|") + ":" + hintPicks.join("|")));
  for (let i = remaining.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
  }
  hintPicks.push(...remaining.slice(0, 3 - hintPicks.length));
  // Последняя защита от устаревшей подсказки при быстром открытии элемента.
  hintPicks = hintPicks.filter(id => !discovered.has(id)).slice(0, 3);
  const picks = hintPicks
    .map(id => `<span class="hint-pick">${iconHTML(id)} ${E[id][0]}</span>`)
    .join("   •   ");
  notifyHTML(`💡 Можно создать: ${picks}`, 6000);
}

function refusePair(a, b){
  [a.el, b.el].forEach(el => {
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
  });
}

function discover(id, at){
  discovered.add(id);
  hintPicks = hintPicks.filter(pick => pick !== id && !discovered.has(pick));
  lastDiscovered = id;
  save();
  renderPalette();
  registerChainDiscovery(id);
  showPopup(iconHTML(id), "Новое открытие!", E[id][0]);
  if (hintbar.classList.contains("show")) showHint();
  if (at){ const size = itemSize(); sparks(at.x + size/2, at.y + size/2); }
  if (discovered.size === TOTAL && !wonShown){
    wonShown = true;
    setTimeout(() => showPopup("🏆", "Вселенная создана!", "Все элементы открыты!"), 2100);
  }
}

// region: MERGE
// ---------- Соединение ----------
function tryMerge(mover){
  const size = itemSize(), radius = mergeRadius();
  const cx = mover.x + size/2, cy = mover.y + size/2;
  let best = null, bestD = Infinity;
  for (const o of items){
    if (o === mover) continue;
    const d = Math.hypot(cx - (o.x+size/2), cy - (o.y+size/2));
    if (d < radius && d < bestD){ bestD = d; best = o; }
  }
  if (!best) return;

  const mergedRecipe = key(mover.id, best.id);
  const res = RECIPE.get(mergedRecipe);
  if (!res){
    refusePair(mover, best);
    return;
  }
  if (discovered.has(res)){
    if (!discoveredRecipes.has(mergedRecipe)){
      discoveredRecipes.add(mergedRecipe);
      saveRecipes();
      renderPalette();
      sparks((mover.x + best.x + size) / 2, (mover.y + best.y + size) / 2);
      notifyHTML(`✨ Новый рецепт: ${iconHTML(mover.id)} ${E[mover.id][0]} + ${iconHTML(best.id)} ${E[best.id][0]}`);
    } else {
      refusePair(mover, best);
      notifyHTML(`${iconHTML(res)} «${E[res][0]}» уже создан — рецепт известен`);
    }
    return;
  }
  discoveredRecipes.add(mergedRecipe);
  saveRecipes();
  const mx = (mover.x + best.x)/2;
  const my = (mover.y + best.y)/2;
  removeItem(mover); removeItem(best);
  const nit = addItem(res, mx, my);
  if (!discovered.has(res)) discover(res, nit);
  else sparks(nit.x + size/2, nit.y + size/2);
}

// region: DRAG_DROP
// ---------- Перетаскивание ----------
document.addEventListener("pointerdown", e => {
  hideTip();
  const chip = e.target.closest(".chip");
  if (chip){
    const touchPalette = e.pointerType === "touch" && window.matchMedia("(max-width:640px)").matches;
    const g = document.createElement("div");
    g.className = "item ghost";
    g.innerHTML = chipHTML(chip.dataset.id);
    g.style.left = e.clientX + "px";
    g.style.top  = e.clientY + "px";
    if (touchPalette) g.style.visibility = "hidden";
    document.body.appendChild(g);
    drag = { type:"new", id:chip.dataset.id, ghost:g, moved:false, pointerType:e.pointerType,
             sx:e.clientX, sy:e.clientY, t0:performance.now(), touchPalette,
             paletteScrollTop:palettePanel.scrollTop, scrollingPalette:false };
    return;
  }
  const el = e.target.closest("#board .item");
  if (el && !el.classList.contains("ghost")){
    const it = items.find(i => i.el === el);
    if (!it) return;
    const b = board.getBoundingClientRect();
    el.classList.add("dragging");
    el.style.zIndex = ++zTop;
    drag = { type:"move", it, pointerType:e.pointerType,
             offX:e.clientX - (b.left + it.x), offY:e.clientY - (b.top + it.y),
             moved:false, sx:e.clientX, sy:e.clientY };
  }
});

document.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (drag.type === "new" && drag.touchPalette){
    const panelRect = palettePanel.getBoundingClientRect();
    const insidePanel = e.clientX >= panelRect.left && e.clientX <= panelRect.right &&
      e.clientY >= panelRect.top && e.clientY <= panelRect.bottom;
    const verticalScroll = Math.abs(dy) > 6 && Math.abs(dy) > Math.abs(dx);
    if (insidePanel && (drag.scrollingPalette || verticalScroll)){
      drag.scrollingPalette = true;
      drag.moved = true;
      drag.ghost.style.visibility = "hidden";
      palettePanel.scrollTop = drag.paletteScrollTop - dy;
      blackHole.classList.remove("ready");
      return;
    }
    if (!insidePanel || Math.abs(dx) > 6){
      drag.scrollingPalette = false;
      drag.ghost.style.visibility = "visible";
    }
  }
  const moveThreshold = drag.pointerType === "touch" ? 9 : 5;
  if (Math.hypot(dx, dy) > moveThreshold) drag.moved = true;
  if (drag.type === "new"){
    drag.ghost.style.left = e.clientX + "px";
    drag.ghost.style.top  = e.clientY + "px";
  } else if (drag.moved){
    const size = itemSize();
    const b = board.getBoundingClientRect();
    let x = clampPos(e.clientX - b.left - drag.offX);
    let y = clampPos(e.clientY - b.top  - drag.offY);
    x = Math.min(x, board.clientWidth  - size - 4);
    y = Math.min(y, board.clientHeight - size - 4);
    drag.it.x = x; drag.it.y = y;
    drag.it.el.style.left = x + "px";
    drag.it.el.style.top  = y + "px";
  }
  blackHole.classList.toggle("ready", drag.moved && isOverBlackHole(e.clientX, e.clientY));
});

function endDrag(e, cancelled){
  if (!drag) return;
  const d = drag; drag = null;
  blackHole.classList.remove("ready");
  if (d.type === "new"){
    d.ghost.remove();
    if (d.scrollingPalette) return;
    const b = board.getBoundingClientRect();
    const inside = e.clientX >= b.left && e.clientX <= b.right &&
                   e.clientY >= b.top  && e.clientY <= b.bottom;
    const tapped = !d.moved && performance.now() - d.t0 < 300;
    if (cancelled) return;
    if (d.moved && isOverBlackHole(e.clientX, e.clientY)) return;
    if (tapped){
      const now = performance.now();
      if (d.id === lastTapId && now - lastTapT < 400) return; // двойной тап — не дублировать
      lastTapId = d.id; lastTapT = now;
    } else {
      lastTapId = null;
    }
    let x, y;
    const size = itemSize();
    if (!inside && tapped){
      x = 10 + Math.random() * (board.clientWidth  - size - 24);
      y = 10 + Math.random() * (board.clientHeight - size - 24);
    } else if (inside){
      x = e.clientX - b.left - size/2;
      y = e.clientY - b.top  - size/2;
    } else return;
    tryMerge(addItem(d.id, x, y));
  } else {
    d.it.el.classList.remove("dragging");
    if (!d.moved && !cancelled && d.pointerType !== "mouse"){
      const now = performance.now();
      if (d.it === lastBoardTapItem && now - lastBoardTapT < 420){
        duplicateItem(d.it);
        lastBoardTapItem = null;
        lastBoardTapT = 0;
        suppressDblClickUntil = now + 650;
      } else {
        lastBoardTapItem = d.it;
        lastBoardTapT = now;
      }
    } else if (d.moved && !cancelled){
      lastBoardTapItem = null;
      if (isOverBlackHole(e.clientX, e.clientY)) consumeItem(d.it);
      else tryMerge(d.it);
    } else if (cancelled){
      lastBoardTapItem = null;
    }
  }
}
document.addEventListener("pointerup",    e => endDrag(e, false));
document.addEventListener("pointercancel",e => endDrag(e, true));

function duplicateItem(it){
  const size = itemSize();
  addItem(it.id, it.x + size + 12, it.y + 10);
}

// двойной клик мышью или двойной тап по элементу — создать одну копию рядом
board.addEventListener("dblclick", e => {
  if (performance.now() < suppressDblClickUntil) return;
  const el = e.target.closest(".item");
  if (!el) return;
  const it = items.find(i => i.el === el);
  if (!it) return;
  duplicateItem(it);
});

const codex      = document.getElementById("codex");
const codexList  = document.getElementById("codexList");
const codexSearch= document.getElementById("codexSearch");

const codexAvailableFilter = document.getElementById("codexAvailableFilter");

const RECIPES_BY_RESULT = (() => {
  const m = new Map();
  for (const [raw, res] of R){
    if (!m.has(res)) m.set(res, []);
    m.get(res).push(raw.split(" "));
  }
  return m;
})();

function recipeListHTML(id){
  const recipes = RECIPES_BY_RESULT.get(id) || [];
  return recipes.map(pair => discoveredRecipes.has(key(pair[0], pair[1]))
    ? `${iconHTML(pair[0])} ${E[pair[0]][0]} + ${iconHTML(pair[1])} ${E[pair[1]][0]}`
    : `<span class="recipe-unknown" title="Рецепт ещё не открыт">❓ + ❓</span>`
  ).join("<br>");
}

function makeCodexRow(id){
  const known = discovered.has(id);
  const row = document.createElement("div");
  row.className = "crow" + (known ? "" : " unknown");
  if (known){
    const rc = recipeListHTML(id) || "базовый элемент";
    row.innerHTML =
      `<span class="em">${iconHTML(id)}</span>` +
      `<span class="nm">${E[id][0]}` +
        (FINAL.has(id) ? `<span class="codex-star" title="Конечный элемент" aria-label="Конечный элемент">✦</span>` : recipeCountHTML(id)) +
      `</span>` +
      `<span class="rc">${rc}</span>` +
      `<button class="cbtn" data-id="${id}" title="Добавить на поле">+</button>`;
  } else {
    row.innerHTML =
      `<span class="em">❓</span><span class="nm">???</span><span class="rc">ещё не открыт</span>`;
  }
  return { row, known };
}

function makeUndiscoveredRow(id){
  const row = document.createElement("div");
  const clue = elementClue(id);
  const clueId = `element-clue-${id}`;
  row.className = "crow undiscovered has-clue";
  row.dataset.id = id;
  row.dataset.readiness = String(openedRecipeComponents(id));
  row.tabIndex = 0;
  row.setAttribute("role", "button");
  row.setAttribute("aria-expanded", "false");
  row.setAttribute("aria-controls", clueId);
  row.setAttribute("aria-label", `${E[id][0]}. Показать подсказку`);
  row.innerHTML =
    `<span class="em">${iconHTML(id)}</span><span class="nm">${E[id][0]}</span>` +
    `<span class="element-clue" id="${clueId}" hidden><strong>Намёк:</strong> ${clue}</span>`;
  return row;
}

function toggleUndiscoveredClue(row){
  const open = !row.classList.contains("clue-open");
  row.classList.toggle("clue-open", open);
  row.setAttribute("aria-expanded", String(open));
  row.setAttribute("aria-label", `${E[row.dataset.id][0]}. ${open ? "Скрыть" : "Показать"} подсказку`);
  const clue = row.querySelector(".element-clue");
  if (clue) clue.hidden = !open;
}

function openedRecipeComponents(id){
  const recipes = RECIPES_BY_RESULT.get(id) || [];
  return recipes.length
    ? Math.max(...recipes.map(pair => pair.filter(component => discovered.has(component)).length))
    : 0;
}

function isAvailableForRecipes(id){
  if (!discovered.has(id) || FINAL.has(id)) return false;
  const [knownRecipes, totalRecipes] = recipeProgress(id);
  return totalRecipes - knownRecipes > 0;
}

function renderCodex(q){
  q = (q || "").trim().toLowerCase();
  codexList.innerHTML = "";
  let shown = 0;
  if (codexMode === "undiscovered"){
    const ids = Object.keys(E)
      .filter(id => !discovered.has(id) && (!q || E[id][0].toLowerCase().includes(q)))
      .sort((a, b) => openedRecipeComponents(b) - openedRecipeComponents(a) ||
        E[a][0].localeCompare(E[b][0], "ru"));
    for (const id of ids){
      codexList.appendChild(makeUndiscoveredRow(id));
      shown++;
    }
  } else if (q){
    // поиск — плоский список подходящих открытых элементов
    const ids = Object.keys(E).sort((x,y) => E[x][0].localeCompare(E[y][0], "ru"));
    for (const id of ids){
      if (!E[id][0].toLowerCase().includes(q) || !discovered.has(id)) continue;
      if (codexShowAvailable.checked && !isAvailableForRecipes(id)) continue;
      codexList.appendChild(makeCodexRow(id).row);
      shown++;
    }
  } else {
    for (const [cid, cname, ids] of CATS){
      const open = ids.filter(discovered.has.bind(discovered));
      const visible = codexShowAvailable.checked ? ids.filter(isAvailableForRecipes) : ids;
      if (!visible.length) continue;
      const h = document.createElement("div");
      h.className = "cat-h";
      h.innerHTML = `<span class="dot" style="background:${CAT_COLOR[cid]}"></span>${cname}` +
        `<span class="cnt">${open.length}/${ids.length}</span>`;
      codexList.appendChild(h);
      for (const id of visible) codexList.appendChild(makeCodexRow(id).row);
      shown += visible.length;
    }
  }
  if (!shown){
    const d = document.createElement("div");
    d.style.cssText = "text-align:center;color:#8f89ad;padding:20px;font-size:13px";
    d.textContent = q ? "Ничего не найдено" : codexMode === "undiscovered"
      ? "Все элементы открыты"
      : codexShowAvailable.checked ? "Нет доступных элементов с неоткрытыми рецептами" : "";
    codexList.appendChild(d);
  }
}
function openCodex(){ renderCodex(""); codex.classList.add("open"); codexSearch.focus(); }
function closeCodex(){ codex.classList.remove("open"); codexSearch.value = ""; }

codexModes.addEventListener("click", e => {
  const button = e.target.closest(".codex-mode");
  if (!button || button.dataset.mode === codexMode) return;
  codexMode = button.dataset.mode;
  codexAvailableFilter.hidden = codexMode !== "all";
  for (const modeButton of codexModes.querySelectorAll(".codex-mode")){
    const active = modeButton === button;
    modeButton.classList.toggle("active", active);
    modeButton.setAttribute("aria-selected", String(active));
  }
  renderCodex(codexSearch.value);
});

codexShowAvailable.addEventListener("change", () => {
  settings.codexShowAvailable = codexShowAvailable.checked;
  saveSettings();
  renderCodex(codexSearch.value);
});

codexList.addEventListener("click", e => {
  const btn = e.target.closest(".cbtn");
  if (btn){
    const id = btn.dataset.id;
    const size = itemSize();
    addItem(id,
      20 + Math.random() * Math.max(1, board.clientWidth  - size - 40),
      20 + Math.random() * Math.max(1, board.clientHeight - size - 40));
    return;
  }
  const undiscoveredRow = e.target.closest(".crow.undiscovered");
  if (undiscoveredRow) toggleUndiscoveredClue(undiscoveredRow);
});

codexList.addEventListener("keydown", e => {
  const row = e.target.closest(".crow.undiscovered");
  if (!row || (e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault();
  toggleUndiscoveredClue(row);
});

document.getElementById("btnCodex").addEventListener("click", openCodex);
document.getElementById("btnCodexClose").addEventListener("click", closeCodex);
codex.addEventListener("click", e => { if (e.target === codex) closeCodex(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeCodex(); });
codexSearch.addEventListener("input", e => renderCodex(e.target.value));

// region: TOOLTIPS
// ---------- Подсказка рецепта при наведении ----------
board.addEventListener("mouseover", e => {
  const el = e.target.closest("#board .item");
  if (!el || el.classList.contains("dragging")) return;
  const it = items.find(i => i.el === el);
  if (!it) return;
  const rc = recipeListHTML(it.id) || "базовый элемент";
  tip.innerHTML = `<div class="t">${iconHTML(it.id)} ${E[it.id][0]}</div><div>${rc}</div>` +
    (FINAL.has(it.id) ? `<div class="f">✦ конечный элемент</div>` : "");
  const r = el.getBoundingClientRect();
  tip.style.left = Math.min(Math.max(r.left + r.width / 2, 130), window.innerWidth - 130) + "px";
  tip.style.top = (r.top - 8) + "px";
  tip.classList.add("show");
});
board.addEventListener("mouseout", e => {
  if (e.target.closest("#board .item")) hideTip();
});

document.getElementById("btnClear").addEventListener("click", () => items.slice().forEach(removeItem));

// region: SETTINGS
function setMenuOpen(open){
  appMenu.classList.toggle("open", open);
  btnMenu.setAttribute("aria-expanded", String(open));
  btnMenu.setAttribute("aria-label", open ? "Закрыть меню" : "Открыть меню");
}
function openSettings(){
  setMenuOpen(false);
  showUnavailableElements.checked = settings.showUnavailableElements;
  settingsModal.classList.add("open");
  showUnavailableElements.focus();
}
function closeSettings(){ settingsModal.classList.remove("open"); }
btnMenu.addEventListener("click", e => {
  e.stopPropagation();
  setMenuOpen(!appMenu.classList.contains("open"));
});
menuWrap.addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", () => setMenuOpen(false));
document.getElementById("btnSettings").addEventListener("click", openSettings);
document.getElementById("btnSettingsClose").addEventListener("click", closeSettings);
settingsModal.addEventListener("click", e => { if (e.target === settingsModal) closeSettings(); });
showUnavailableElements.addEventListener("change", () => {
  settings.showUnavailableElements = showUnavailableElements.checked;
  saveSettings();
  renderPalette();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    setMenuOpen(false);
    closeSettings();
    closeDiscoveryChain();
  }
});

document.getElementById("btnReset").addEventListener("click", () => {
  setMenuOpen(false);
  if (confirm("Начать заново? Все открытия будут потеряны.")){
    localStorage.removeItem("alchemy.discovered");
    localStorage.removeItem(DISCOVERED_RECIPES_KEY);
    localStorage.removeItem(DISCOVERY_CHAIN_KEY);
    location.reload();
  }
});

// region: STARTUP
// ---------- Старт ----------
if (!discoveryChain.length) startNewDiscoveryChain();
else updateChainButton();
renderPalette();
requestAnimationFrame(() => {
  const n = BASE.length, gap = window.matchMedia("(max-width:640px)").matches ? 82 : 110;
  const size = itemSize();
  const startX = board.clientWidth/2  - gap*(n-1)/2 - size/2;
  const startY = board.clientHeight/2 - size/2;
  BASE.forEach((id,i) => addItem(id, startX + i*gap, startY));
});
</script>
</body>
