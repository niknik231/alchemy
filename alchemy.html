<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>⚗️ Алхимия</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚗️</text></svg>">
<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(1200px 800px at 70% -10%, #3b2f63 0%, transparent 60%),
    radial-gradient(900px 700px at 10% 110%, #14343f 0%, transparent 55%),
    linear-gradient(160deg,#12101f,#1c1830 60%,#151222);
  color:#eceaf6;height:100%;display:flex;flex-direction:column;overflow:hidden;
  user-select:none;-webkit-user-select:none
}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);flex-wrap:wrap}
header h1{font-size:19px;font-weight:600;margin-right:auto;display:flex;align-items:center;gap:10px}
#counter{font-size:13px;color:#a9a4c6;background:rgba(255,255,255,.06);padding:3px 10px;border-radius:999px;font-weight:400}
button{font:inherit;color:inherit;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:6px 12px;border-radius:10px;cursor:pointer;transition:.15s}
button:hover{background:rgba(255,255,255,.15)}
button:active{transform:scale(.96)}
.menu-wrap{position:relative;flex:none}
.menu-trigger{height:35px;min-width:40px;padding:6px 10px;font-size:20px;line-height:1}
.app-menu{position:absolute;top:calc(100% + 8px);right:0;width:min(280px,calc(100vw - 20px));display:none;padding:14px;background:rgba(24,21,44,.98);border:1px solid rgba(255,255,255,.16);border-radius:14px;box-shadow:0 16px 38px rgba(0,0,0,.48);z-index:900}
.app-menu.open{display:block;animation:menuIn .16s ease-out}
@keyframes menuIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.menu-title{font-size:16px;font-weight:700;color:#f2efff;margin-bottom:6px}
.menu-about{font-size:12px;line-height:1.45;color:#aaa5c4;margin-bottom:10px}
.menu-version{font-size:11px;color:#817b9e;padding-top:9px;border-top:1px solid rgba(255,255,255,.08)}
.app-menu .menu-link{width:100%;margin:2px 0 12px;display:flex;align-items:center;gap:8px;text-align:left}
.app-menu #btnReset{width:100%;margin-top:12px;color:#ffc7c7;background:rgba(210,71,71,.12);border-color:rgba(255,112,112,.25)}
.app-menu #btnReset:hover{background:rgba(210,71,71,.24)}
.game-icon{display:inline-block;width:1em;height:1em;vertical-align:-.14em;overflow:visible}
.scene-icon{filter:drop-shadow(0 2px 2px rgba(0,0,0,.42))}
main{flex:1;display:flex;min-height:0}
aside{width:236px;padding:10px;overflow-y:auto;border-right:1px solid rgba(255,255,255,.07)}
aside h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#8f89ad;margin:2px 2px 8px}
#palette{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:64px;height:64px;border-radius:14px;cursor:grab;touch-action:none;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12);transition:.15s}
.chip:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.32)}
.chip .em{font-size:26px;line-height:1}
.chip .nm{font-size:10px;color:#cfcbe6;text-align:center;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recipe-count{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:9px;font-weight:700;line-height:1;color:#d9d5ea;background:#302b49;border:1px solid rgba(255,255,255,.2);box-shadow:0 2px 7px rgba(0,0,0,.35)}
.chip.new{animation:newGlow 2.2s ease-out}
@keyframes newGlow{0%{box-shadow:0 0 0 2px rgba(255,215,0,.9),0 0 26px rgba(255,215,0,.6)}100%{box-shadow:none}}
#board{flex:1;position:relative;overflow:hidden}
.item{position:absolute;width:76px;height:76px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:grab;touch-action:none;z-index:1;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(0,0,0,.35);animation:pop .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.item.dragging{cursor:grabbing;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.item.consumed{pointer-events:none;animation:consume .28s ease-in forwards !important}
@keyframes consume{to{transform:scale(.05) rotate(120deg);opacity:0;filter:blur(5px)}}
.item .em{font-size:30px;line-height:1}
.item .nm{font-size:10px;color:#ddd9f0;text-align:center;max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shake{animation:shake .35s !important}
@keyframes shake{0%,100%{translate:0 0}20%,60%{translate:-6px 0}40%,80%{translate:6px 0}}
.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.85;transform:translate(-50%,-50%);animation:none !important}
.spark{position:fixed;z-index:998;pointer-events:none;font-size:18px;animation:fly .6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#hintbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);box-sizing:border-box;width:max-content;max-width:calc(100% - 32px);background:rgba(22,19,42,.96);border:1px solid rgba(255,255,255,.16);padding:9px 18px;border-radius:12px;font-size:14px;line-height:1.35;opacity:0;pointer-events:none;transition:.3s;text-align:center;white-space:normal;overflow-wrap:anywhere;z-index:450}
#hintbar.show{opacity:1}
#hintbar .hint-pick{display:inline-flex;align-items:center;gap:5px}
#hintbar .hint-pick .game-icon{font-size:18px}
#blackHole{position:absolute;right:18px;bottom:18px;width:76px;height:76px;display:grid;place-items:center;border-radius:50%;z-index:400;pointer-events:none;font-size:42px;line-height:1;background:radial-gradient(circle at 50% 48%,#000 0 34%,#171124 40%,#7554a8 55%,rgba(108,75,158,.18) 69%,transparent 72%);filter:drop-shadow(0 0 9px rgba(152,105,220,.45));transition:transform .16s,filter .16s}
#blackHole::after{content:"";position:absolute;inset:5px;border:2px solid rgba(207,176,255,.3);border-radius:50%;transform:rotate(-18deg) scaleY(.48)}
#blackHole.ready{transform:scale(1.16) rotate(8deg);filter:drop-shadow(0 0 18px rgba(190,139,255,.9))}
#popup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:.25s;z-index:1000}
#popup.show{opacity:1}
#popup .card{background:rgba(24,21,44,.96);border:1px solid rgba(255,215,0,.45);border-radius:20px;padding:24px 44px;text-align:center;box-shadow:0 0 60px rgba(255,215,0,.25);transform:scale(.75) translateY(10px);transition:.25s cubic-bezier(.34,1.56,.64,1)}
#popup.show .card{transform:scale(1) translateY(0)}
#popup .big{font-size:62px;line-height:1.15}
#popup .big .game-icon{width:1em;height:1em}
#popup .ttl{color:#ffd75e;font-weight:700;margin-top:4px}
#popup .val{font-size:20px;margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(8,6,18,.72);display:none;align-items:center;justify-content:center;z-index:500}
.modal.open{display:flex}
.sheet{width:min(600px,94vw);max-height:84vh;display:flex;flex-direction:column;background:#191631;border:1px solid rgba(255,255,255,.14);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55);animation:pop .22s cubic-bezier(.34,1.56,.64,1)}
.sheet-head{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sheet-head h2{font-size:15px;margin-right:auto}
#codexSearch{flex:0 1 220px;font:inherit;font-size:13px;color:inherit;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:6px 10px;outline:none}
#codexSearch:focus{border-color:rgba(255,215,0,.5)}
.codex-modes{display:flex;gap:6px;padding:8px 12px 0}
.codex-mode{flex:1;padding:6px 10px;font-size:12px;color:#aaa5c4;background:rgba(255,255,255,.04)}
.codex-mode.active{color:#f1edff;background:rgba(137,108,207,.24);border-color:rgba(190,160,255,.38)}
.codex-filter{display:flex;align-items:center;gap:8px;margin:8px 12px 0;padding:7px 10px;border-radius:10px;color:#c8c3da;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:12px;cursor:pointer}
.codex-filter[hidden]{display:none}
.codex-filter input{accent-color:#8b6bc4}
#codexList{overflow-y:auto;padding:8px}
.chain-sheet{width:min(520px,94vw)}
.chain-body{padding:16px;overflow-y:auto}
.chain-intro{font-size:13px;line-height:1.5;color:#b9b4cd;margin-bottom:14px}
.chain-progress{height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:16px}
.chain-progress > span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#7a5bb7,#ffd75e);transition:width .3s ease}
.chain-steps{display:flex;flex-direction:column;gap:8px}
.chain-step{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:54px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
.chain-step .chain-icon{font-size:24px;line-height:1;text-align:center}
.chain-step .chain-copy{min-width:0;display:flex;flex-direction:column;gap:2px}
.chain-step .chain-label{font-size:11px;color:#8f89ad}
.chain-step .chain-name{font-size:14px;color:#ddd9ed;overflow-wrap:anywhere}
.chain-step .chain-state{font-size:16px;color:#77718e}
.chain-step.done{border-color:rgba(129,199,132,.24);background:rgba(82,150,87,.09)}
.chain-step.done .chain-state{color:#81c784}
.chain-step.current{border-color:rgba(255,215,94,.38);background:rgba(255,215,94,.08);box-shadow:0 0 18px rgba(255,215,94,.06)}
.chain-step.current .chain-label,.chain-step.current .chain-state{color:#ffd75e}
.chain-step.locked .chain-icon,.chain-step.locked .chain-name{color:#77718e}
.chain-actions{display:flex;justify-content:flex-end;margin-top:14px}
.chain-actions button{color:#f3e8b0;border-color:rgba(255,215,94,.3);background:rgba(255,215,94,.09)}
.chain-empty{text-align:center;padding:22px 10px;color:#aaa5c4;font-size:13px;line-height:1.5}
.settings-sheet{width:min(500px,94vw)}
.settings-body{padding:14px}
.setting-row{display:flex;align-items:center;gap:16px;padding:14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);cursor:pointer}
.setting-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:4px}
.setting-copy strong{font-size:14px;color:#f0edf9}
.setting-copy small{font-size:12px;line-height:1.4;color:#aaa5c4}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.switch-track{position:absolute;inset:0;border-radius:999px;background:#39354d;border:1px solid rgba(255,255,255,.15);transition:.18s}
.switch-track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#bbb6ca;box-shadow:0 2px 5px rgba(0,0,0,.35);transition:.18s}
.switch input:checked + .switch-track{background:#7256aa;border-color:#aa8ee0}
.switch input:checked + .switch-track::after{transform:translateX(20px);background:#fff}
.switch input:focus-visible + .switch-track{outline:2px solid #d3b8ff;outline-offset:2px}
.palette-empty{padding:10px 4px;color:#8f89ad;font-size:12px;line-height:1.4}
.crow{position:relative;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px}
.crow:nth-child(even){background:rgba(255,255,255,.04)}
.crow .em{font-size:22px;width:30px;text-align:center;flex:none;line-height:1}
.crow .nm{font-size:14px;width:160px;flex:none;display:flex;align-items:center;gap:6px}
.crow .nm .recipe-count{position:static;display:inline-flex;flex:none;box-shadow:none}
.codex-star{flex:none;color:#ffd75e;font-size:14px;line-height:1;text-shadow:0 1px 4px rgba(0,0,0,.75)}
.crow.unknown .nm{color:#8f89ad}
.crow.undiscovered{cursor:pointer}
.crow.undiscovered:hover{background:rgba(255,255,255,.075)}
.crow.undiscovered:focus-visible{outline:2px solid #d3b8ff;outline-offset:-2px}
.crow.undiscovered .nm{color:#d4cfea}
.crow .rc{font-size:12px;color:#a9a4c6;margin-left:auto;text-align:right}
.crow.undiscovered.has-clue{align-items:flex-start;flex-wrap:wrap}
.element-clue{display:none;flex-basis:calc(100% - 42px);margin:-4px 0 2px 42px;padding:6px 9px;border-left:2px solid rgba(255,215,94,.45);font-size:11.5px;line-height:1.4;color:#bbb5d2;font-style:italic}
.crow.undiscovered.clue-open .element-clue{display:block}
.element-clue strong{color:#e7cf7b;font-style:normal;font-weight:600}
.recipe-unknown{color:#ffd75e;font-weight:700;letter-spacing:.08em}
.cat-h{flex-basis:100%;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8f89ad;margin:12px 2px 6px;display:flex;align-items:center;gap:6px}
aside h2 + .hidefin + .cat-h{margin-top:4px}
.cat-h:first-child{margin-top:2px}
.cat-h .dot{width:8px;height:8px;border-radius:50%;flex:none}
.cat-h .cnt{margin-left:auto;font-size:10px;letter-spacing:0;text-transform:none}
.chip.final,.item.final{filter:saturate(.55) brightness(.82)}
.item.final::after,.chip.final::after{content:"✦";position:absolute;top:-5px;right:-5px;font-size:12px;color:#ffd75e;text-shadow:0 1px 4px rgba(0,0,0,.9)}
#tip .f{color:#ffd75e;margin-top:3px;font-weight:600}
.cbtn{flex:none;width:26px;height:26px;padding:0;border-radius:8px;font-size:17px;line-height:1;color:#ffd75e;background:rgba(255,215,0,.10);border:1px solid rgba(255,215,0,.35)}
.cbtn:hover{background:rgba(255,215,0,.28)}
#tip{position:fixed;z-index:600;pointer-events:none;transform:translate(-50%,-100%);background:rgba(22,19,42,.96);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:7px 12px;font-size:12.5px;color:#e8e5f5;opacity:0;transition:opacity .12s;white-space:nowrap}
#tip.show{opacity:1}
#tip .t{color:#ffd75e;font-weight:600;margin-bottom:2px}
@media(max-width:640px){
  header{gap:6px;padding:8px 10px;flex-wrap:nowrap}
  header h1{font-size:17px;gap:7px;white-space:nowrap}
  #counter{font-size:12px;padding:3px 8px}
  header > button,.menu-trigger{width:34px;min-width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:18px;flex:none}
  header > button .btn-label,.menu-trigger .btn-label{display:none}
  main{flex-direction:column-reverse}
  aside{width:100%;height:158px;border-right:none;border-top:1px solid rgba(255,255,255,.07)}
  .chip{width:54px;height:54px;border-radius:12px}
  .chip .em{font-size:22px}.chip .nm{font-size:9px;max-width:50px}
  .recipe-count{min-width:16px;height:16px;padding:0 4px;font-size:8px}
  .item{width:56px;height:56px;border-radius:13px}.item .em{font-size:22px}.item .nm{font-size:9px;max-width:52px}
  #hintbar{bottom:82px;width:calc(100% - 24px);max-width:none;padding:8px 12px;font-size:12px}
  #blackHole{width:64px;height:64px;right:12px;bottom:12px;font-size:36px}
  .sheet{width:calc(100vw - 16px);max-height:calc(100dvh - 24px);border-radius:14px}
  .sheet-head{gap:8px;padding:10px}
  .sheet-head h2{font-size:14px;white-space:nowrap}
  #codexSearch{flex:1 1 auto;min-width:0;width:auto}
  #btnCodexClose{width:40px;min-width:40px;height:40px;padding:0}
  .codex-modes{padding:8px 8px 0}
  .codex-filter{margin:8px 8px 0}
  #codexList{padding:6px;overscroll-behavior:contain}
  .crow{display:grid;width:100%;min-width:0;overflow:hidden;grid-template-columns:30px minmax(0,1fr) minmax(26px,max-content);grid-template-rows:auto auto;column-gap:8px;row-gap:5px;align-items:start;padding:10px 8px}
  .crow .em{grid-column:1;grid-row:1 / span 2;width:30px;align-self:start}
  .crow .nm{grid-column:2;grid-row:1;width:auto;min-width:0;max-width:100%;line-height:1.25;white-space:normal;overflow-wrap:anywhere}
  .crow .rc{grid-column:2;grid-row:2;min-width:0;max-width:100%;margin:0;text-align:left;line-height:1.35;white-space:normal;overflow-wrap:anywhere;word-break:normal;hyphens:auto}
  .crow .cbtn{grid-column:3;grid-row:2;align-self:end;justify-self:end}
  .crow > .recipe-count{position:static;grid-column:3;grid-row:1;align-self:start;justify-self:end;transform:none}
  .crow.unknown .rc,.crow.undiscovered .rc{grid-column:2 / -1}
  .crow.undiscovered.has-clue{align-items:start}
  .crow .element-clue{grid-column:2 / -1;grid-row:3;width:auto;margin:0;padding:7px 9px}
}
@media(max-width:380px){
  .sheet{width:calc(100vw - 10px)}
  .sheet-head{padding:8px}
  .crow{grid-template-columns:28px minmax(0,1fr) minmax(26px,max-content);column-gap:6px;padding:9px 6px}
  .crow .em{width:28px;font-size:21px}
  .crow .rc{font-size:11.5px}
}

</style>
</head>
<body>
<header>
  <h1>⚗️ Алхимия <span id="counter">0 / 0</span></h1>
  <div class="menu-wrap">
    <button class="menu-trigger" id="btnMenu" title="Меню">☰</button>
    <div class="app-menu">
      <div class="menu-title">⚗️ Алхимия</div>
      <div class="menu-about">Игра о создании новых элементов из сочетаний уже открытых.</div>
      <button class="menu-link" id="btnReset">🔄 Сбросить прогресс</button>
      <div class="menu-version">Версия 2.0.0 (refactored)</div>
    </div>
  </div>
</header>
<main>
  <aside>
    <h2>Элементы</h2>
    <div id="palette"></div>
  </aside>
  <div id="board">
    <div id="hintbar"></div>
    <div id="blackHole">🕳️</div>
    <div id="popup"><div class="card"></div></div>
  </div>
</main>

<script>

итву или остро наточенные ножницы.","iconType":"emoji","isBase":false},{"id":"clover","name":"Клевер","icon":"🐾","category":"life","hint":"Ищите то, что многолетнее травянистое растение, которое произрастает в Азии и Европе. Первый лист символизирует надежду, второй – веру, третий – любовь, а четвертый – удачу.","iconType":"emoji","isBase":false},{"id":"isaak_newton","name":"Исаак Ньютон","icon":"🎭","category":"culture","hint":"Главный признак: английский физик, математик, механик и астроном, один из создателей классической физики и математического анализа. Ньютон открыл свой знаменитый закон всемирного тяготения после того, как ему на голову упало это.","iconType":"emoji","isBase":false},{"id":"bush","name":"Куст","icon":"🐾","category":"life","hint":"Подсказка ведёт к тому, что растение с древовидными ветвями, начинающимися почти от самой поверхности земли.","iconType":"emoji","isBase":false},{"id":"assassin","name":"Убийца","icon":"👤","category":"civ","hint":"Ориентир: это, убивший, преступно умертвивший кого-нибудь.","iconType":"emoji","isBase":false},{"id":"observatory","name":"Обсерватория","icon":"🏗️","category":"transport","hint":"Обратите внимание: сооружение, используемое для наблюдения и слежения за различными объектами и явлениями на Земле и в космосе.","iconType":"emoji","isBase":false},{"id":"berry","name":"Ягода","icon":"🍎","category":"food","hint":"Ориентир: небольшой сочный плод кустарников, полукустарников, кустарничков и травянистых растений.","iconType":"emoji","isBase":false},{"id":"smog","name":"Смог","icon":"👤","category":"civ","hint":"Подсказка ведёт к тому, что густая удушливая пелена дыма, копоти, выхлопных газов и т. п.","iconType":"emoji","isBase":false},{"id":"galileo","name":"Галилео Галилей","icon":"🎭","category":"culture","hint":"Главный признак: итальянский физик, механик, это, философ, математик, оказавший значительное влияние на науку своего времени. Он одним из первых использовал это для наблюдения небесных тел и сделал ряд выдающихся астрономических открытий.","iconType":"emoji","isBase":false},{"id":"obsidian","name":"Обсидиан","icon":"🔹","category":"elem","hint":"Главный признак: магматическая горная порода, разновидность вулканического стекла, образующегося в результате быстрого охлаждения лавы.","iconType":"emoji","isBase":false},{"id":"acid_rain","name":"Кислотный дождь","icon":"🌧️","category":"sky","hint":"Ищите то, что осадки, при которых наблюдается понижение водородного показателя дождевых осадков из-за загрязнений воздуха кислотными оксидами, обычно оксидами серы и оксидами азота.","iconType":"emoji","isBase":false},{"id":"rum","name":"Ром","icon":"🍽️","category":"food","hint":"Главный признак: крепкий напиток из перебродившего сока или патоки, получаемых при производстве тростникового сахара. это известен как напиток пиратов, моряков и разбойников.","iconType":"emoji","isBase":false},{"id":"sarcophagus","name":"Саркофаг","icon":"👤","category":"civ","hint":"Подсказка ведёт к тому, что резной каменный это, который использовался для захоронения знатных людей. Слово это является частью древнегреческого именного словосочетания λίθος σαρκοφάγος (lithos sarcophagos, букв.","iconType":"emoji","isBase":false},{"id":"beekeeper","name":"Пчеловод","icon":"👤","category":"civ","hint":"Главный признак: это занимающийся содержанием и разведением пчёл.","iconType":"emoji","isBase":false},{"id":"honeycombs","name":"Соты","icon":"🍽️","category":"food","hint":"Главный признак: восковые постройки медоносных и близких к ним видов пчёл, состоящие из упорядоченных ячеек.","iconType":"emoji","isBase":false},{"id":"radio_wave","name":"Радиоволна","icon":"🌊","category":"tech","hint":"Ищите то, что электромагнитная волна, используемая для беспроволочной передачи звуков и знаков на расстояние.","iconType":"emoji","isBase":false},{"id":"sand_storm","name":"Песчаная буря","icon":"🌪️","category":"geo","hint":"Ориентир: атмосферное явление в виде переноса больших количеств пыли (песка, частиц почвы, песчинок) вет "use strict";

// ============================================
// ALCHEMY GAME ENGINE - Refactored & Modular
// ============================================

class AlchemyEngine {
  constructor() {
    this.elements = new Map();      // id -> element data
    this.recipes = new Map();       // "a b" -> result (sorted)
    this.recipesUsing = new Map();  // id -> array of recipes where it's an ingredient
    this.baseElements = new Set();
    this.discovered = new Set();
    this.categories = new Map();
    this.customIcons = new Map();
    this.fullIcons = new Map();
    this.clues = new Map();
    this.settings = {
      showUnavailableElements: true,
      codexShowAvailable: false,
    };
    
    this.SETTINGS_KEY = "alchemy.settings";
    this.SAVE_KEY = "alchemy.save";
    this.VERSION = "2.0.0-refactored";
  }

  load() {
    const elementsData = window._ALCHEMY_ELEMENTS;
    const recipesData = window._ALCHEMY_RECIPES;
    const categoriesData = window._ALCHEMY_CATEGORIES;
    const iconsData = window._ALCHEMY_ICONS || {};
    
    this.initElements(elementsData);
    this.initRecipes(recipesData);
    this.initCategories(categoriesData);
    this.initIcons(iconsData);
    this.loadSettings();
    this.loadProgress();
    
    // Discover base elements by default
    for (const id of this.baseElements) {
      this.discovered.add(id);
    }
    
    console.log(`Alchemy Engine loaded: ${this.elements.size} elements, ${this.recipes.size} recipes`);
  }

  initElements(data) {
    for (const el of data) {
      this.elements.set(el.id, el);
      if (el.isBase) this.baseElements.add(el.id);
      if (el.hint) this.clues.set(el.id, el.hint);
    }
  }

  initRecipes(data) {
    for (const [a, b, result] of data) {
      const key = this.recipeKey(a, b);
      this.recipes.set(key, result);
      
      // Track which recipes use each ingredient
      if (!this.recipesUsing.has(a)) this.recipesUsing.set(a, []);
      if (!this.recipesUsing.has(b)) this.recipesUsing.set(b, []);
      this.recipesUsing.get(a).push({ partner: b, result });
      this.recipesUsing.get(b).push({ partner: a, result });
    }
  }

  initCategories(data) {
    for (const cat of data) {
      this.categories.set(cat.id, cat);
    }
  }

  initIcons(data) {
    for (const [id, svg] of Object.entries(data)) {
      this.customIcons.set(id, svg);
    }
  }

  recipeKey(a, b) {
    return a < b ? `${a} ${b}` : `${b} ${a}`;
  }

  combine(a, b) {
    const key = this.recipeKey(a, b);
    const result = this.recipes.get(key);
    
    if (result && this.discovered.has(a) && this.discovered.has(b)) {
      const wasNew = !this.discovered.has(result);
      this.discovered.add(result);
      this.saveProgress();
      return { result, isNew: wasNew };
    }
    
    return null;
  }

  getElement(id) {
    return this.elements.get(id);
  }

  getDiscoveredElements() {
    return Array.from(this.discovered).map(id => this.elements.get(id)).filter(Boolean);
  }

  getAvailableElements() {
    // Elements that can be crafted from discovered ones
    const available = new Set();
    for (const [id, recipes] of this.recipesUsing) {
      if (this.discovered.has(id)) {
        for (const { partner, result } of recipes) {
          if (this.discovered.has(partner) && !this.discovered.has(result)) {
            available.add(result);
          }
        }
      }
    }
    return Array.from(available);
  }

  getRecipesFor(elementId) {
    return this.recipesUsing.get(elementId) || [];
  }

  getClue(elementId) {
    return this.clues.get(elementId) || "";
  }

  getIconHTML(elementId) {
    const el = this.elements.get(elementId);
    if (!el) return "";
    
    if (el.iconType === "svg" && this.customIcons.has(elementId)) {
      return this.customIcons.get(elementId);
    }
    
    if (el.iconType === "full") {
      const textSize = el.icon.length > 5 ? 43 : 50;
      return `<svg class="game-icon scene-icon" viewBox="0 0 64 64" aria-hidden="true">` +
        `<text x="32" y="51" text-anchor="middle" font-size="${textSize}" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">${el.icon}</text>` +
        `</svg>`;
    }
    
    // Default: emoji
    return `<span class="em">${el.icon}</span>`;
  }

  getCategoryColor(catId) {
    return this.categories.get(catId)?.color || "#888888";
  }

  getCategoryName(catId) {
    return this.categories.get(catId)?.name || catId;
  }

  isFinal(elementId) {
    // An element is "final" if it's never used as an ingredient
    return !this.recipesUsing.has(elementId) || this.recipesUsing.get(elementId).length === 0;
  }

  // Persistence
  saveProgress() {
    localStorage.setItem(this.SAVE_KEY, JSON.stringify({
      version: this.VERSION,
      discovered: Array.from(this.discovered),
      timestamp: Date.now()
    }));
  }

  loadProgress() {
    try {
      const saved = JSON.parse(localStorage.getItem(this.SAVE_KEY));
      if (saved && saved.discovered) {
        for (const id of saved.discovered) {
          if (this.elements.has(id)) {
            this.discovered.add(id);
          }
        }
      }
    } catch (e) {
      console.warn("Failed to load progress:", e);
    }
  }

  resetProgress() {
    this.discovered.clear();
    for (const id of this.baseElements) {
      this.discovered.add(id);
    }
    this.saveProgress();
  }

  loadSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem(this.SETTINGS_KEY));
      if (saved) Object.assign(this.settings, saved);
    } catch (e) {
      console.warn("Failed to load settings:", e);
    }
  }

  saveSettings() {
    localStorage.setItem(this.SETTINGS_KEY, JSON.stringify(this.settings));
  }

  // Export/Import
  exportSave() {
    return JSON.stringify({
      version: this.VERSION,
      discovered: Array.from(this.discovered),
      timestamp: Date.now()
    });
  }

  importSave(jsonString) {
    try {
      const data = JSON.parse(jsonString);
      if (data.discovered) {
        this.discovered.clear();
        for (const id of data.discovered) {
          if (this.elements.has(id)) this.discovered.add(id);
        }
        this.saveProgress();
        return true;
      }
    } catch (e) {
      console.error("Invalid save data:", e);
    }
    return false;
  }
}

"use strict";

// ============================================
// ALCHEMY GAME UI
// ============================================

class AlchemyUI {
  constructor(engine) {
    this.engine = engine;
    this.board = document.getElementById("board");
    this.palette = document.getElementById("palette");
    this.counter = document.getElementById("counter");
    this.hintbar = document.getElementById("hintbar");
    this.popup = document.getElementById("popup");
    
    this.dragState = null;
    this.boardItems = []; // { id, x, y, el }
    this.nextZ = 1;
    
    this.init();
  }

  init() {
    this.engine.load();
    this.renderPalette();
    this.updateCounter();
    this.bindEvents();
    this.showHint("Перетаскивай элементы друг на друга, чтобы создавать новые!");
  }

  renderPalette() {
    this.palette.innerHTML = "";
    const elements = this.engine.getDiscoveredElements();
    
    // Group by category
    const byCategory = {};
    for (const el of elements) {
      const cat = el.category || "elem";
      if (!byCategory[cat]) byCategory[cat] = [];
      byCategory[cat].push(el);
    }
    
    // Sort categories
    const catOrder = ["base", "elem", "sky", "geo", "life", "craft", "food", "transport", "tech", "science", "civ", "culture", "myst", "space"];
    
    for (const catId of catOrder) {
      const catElements = byCategory[catId];
      if (!catElements || catElements.length === 0) continue;
      
      const cat = this.engine.categories.get(catId);
      const header = document.createElement("h2");
      header.textContent = cat ? cat.name : catId;
      this.palette.appendChild(header);
      
      for (const el of catElements) {
        const chip = this.createChip(el);
        this.palette.appendChild(chip);
      }
    }
  }

  createChip(el) {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.dataset.id = el.id;
    chip.draggable = true;
    
    const icon = document.createElement("span");
    icon.className = "em";
    icon.innerHTML = this.engine.getIconHTML(el.id);
    
    const name = document.createElement("span");
    name.className = "nm";
    name.textContent = el.name;
    
    chip.appendChild(icon);
    chip.appendChild(name);
    
    // Drag from palette
    chip.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", el.id);
      e.dataTransfer.effectAllowed = "copy";
    });
    
    // Touch support
    chip.addEventListener("touchstart", (e) => this.onPaletteTouchStart(e, el), { passive: false });
    
    return chip;
  }

  createBoardItem(el, x, y) {
    const item = document.createElement("div");
    item.className = "item";
    item.dataset.id = el.id;
    item.style.left = x + "px";
    item.style.top = y + "px";
    item.style.zIndex = this.nextZ++;
    
    const icon = document.createElement("span");
    icon.className = "em";
    icon.innerHTML = this.engine.getIconHTML(el.id);
    
    const name = document.createElement("span");
    name.className = "nm";
    name.textContent = el.name;
    
    item.appendChild(icon);
    item.appendChild(name);
    
    // Make draggable
    this.makeDraggable(item, el.id);
    
    this.board.appendChild(item);
    this.boardItems.push({ id: el.id, x, y, el: item });
    
    return item;
  }

  makeDraggable(item, elementId) {
    let startX, startY, startLeft, startTop;
    
    const onPointerDown = (e) => {
      e.preventDefault();
      item.style.zIndex = this.nextZ++;
      item.classList.add("dragging");
      
      const rect = item.getBoundingClientRect();
      const boardRect = this.board.getBoundingClientRect();
      
      startX = e.clientX || (e.touches && e.touches[0].clientX);
      startY = e.clientY || (e.touches && e.touches[0].clientY);
      startLeft = item.offsetLeft;
      startTop = item.offsetTop;
      
      const onPointerMove = (e2) => {
        const cx = e2.clientX || (e2.touches && e2.touches[0].clientX);
        const cy = e2.clientY || (e2.touches && e2.touches[0].clientY);
        
        item.style.left = (startLeft + cx - startX) + "px";
        item.style.top = (startTop + cy - startY) + "px";
        
        // Check for overlap
        this.checkCombine(item, elementId);
      };
      
      const onPointerUp = () => {
        item.classList.remove("dragging");
        document.removeEventListener("mousemove", onPointerMove);
        document.removeEventListener("mouseup", onPointerUp);
        document.removeEventListener("touchmove", onPointerMove);
        document.removeEventListener("touchend", onPointerUp);
      };
      
      document.addEventListener("mousemove", onPointerMove);
      document.addEventListener("mouseup", onPointerUp);
      document.addEventListener("touchmove", onPointerMove, { passive: false });
      document.addEventListener("touchend", onPointerUp);
    };
    
    item.addEventListener("mousedown", onPointerDown);
    item.addEventListener("touchstart", onPointerDown, { passive: false });
  }

  checkCombine(draggedItem, draggedId) {
    const draggedRect = draggedItem.getBoundingClientRect();
    const cx = draggedRect.left + draggedRect.width / 2;
    const cy = draggedRect.top + draggedRect.height / 2;
    
    for (const other of this.boardItems) {
      if (other.el === draggedItem) continue;
      
      const otherRect = other.el.getBoundingClientRect();
      const ox = otherRect.left + otherRect.width / 2;
      const oy = otherRect.top + otherRect.height / 2;
      
      const dist = Math.hypot(cx - ox, cy - oy);
      if (dist < 40) {
        // Try to combine
        const result = this.engine.combine(draggedId, other.id);
        if (result) {
          this.onCombineSuccess(draggedItem, other.el, result);
          return;
        }
      }
    }
  }

  onCombineSuccess(itemA, itemB, result) {
    // Remove both items
    itemA.classList.add("consumed");
    itemB.classList.add("consumed");
    
    // Calculate center position
    const rectA = itemA.getBoundingClientRect();
    const rectB = itemB.getBoundingClientRect();
    const boardRect = this.board.getBoundingClientRect();
    
    const cx = ((rectA.left + rectB.left) / 2 + rectA.width / 2) - boardRect.left;
    const cy = ((rectA.top + rectB.top) / 2 + rectA.height / 2) - boardRect.top;
    
    // Remove from tracking
    this.boardItems = this.boardItems.filter(bi => bi.el !== itemA && bi.el !== itemB);
    
    setTimeout(() => {
      itemA.remove();
      itemB.remove();
      
      // Create result
      const newItem = this.createBoardItem(this.engine.getElement(result.result), cx - 38, cy - 38);
      
      if (result.isNew) {
        newItem.classList.add("new");
        this.showPopup(result.result);
        this.renderPalette(); // Re-render to show new element
      }
      
      this.updateCounter();
      this.createSparks(cx, cy);
    }, 280);
  }

  createSparks(x, y) {
    const emojis = ["✨", "⭐", "💫", "🌟"];
    for (let i = 0; i < 6; i++) {
      const spark = document.createElement("div");
      spark.className = "spark";
      spark.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      spark.style.left = x + "px";
      spark.style.top = y + "px";
      const angle = (Math.PI * 2 * i) / 6;
      const dist = 60 + Math.random() * 40;
      spark.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      spark.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      document.body.appendChild(spark);
      setTimeout(() => spark.remove(), 600);
    }
  }

  showPopup(elementId) {
    const el = this.engine.getElement(elementId);
    const card = this.popup.querySelector(".card");
    card.innerHTML = `
      <div class="big">${this.engine.getIconHTML(elementId)}</div>
      <div class="ttl">${el.name}</div>
      <div class="val">Новый элемент!</div>
    `;
    this.popup.classList.add("show");
    setTimeout(() => this.popup.classList.remove("show"), 2000);
  }

  showHint(text) {
    this.hintbar.textContent = text;
    this.hintbar.classList.add("show");
    setTimeout(() => this.hintbar.classList.remove("show"), 4000);
  }

  updateCounter() {
    const total = this.engine.elements.size;
    const discovered = this.engine.discovered.size;
    this.counter.textContent = `${discovered} / ${total}`;
  }

  onPaletteTouchStart(e, el) {
    e.preventDefault();
    const touch = e.touches[0];
    const boardRect = this.board.getBoundingClientRect();
    const x = touch.clientX - boardRect.left - 38;
    const y = touch.clientY - boardRect.top - 38;
    this.createBoardItem(el, x, y);
  }

  bindEvents() {
    // Board drop zone
    this.board.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "copy";
    });
    
    this.board.addEventListener("drop", (e) => {
      e.preventDefault();
      const id = e.dataTransfer.getData("text/plain");
      const boardRect = this.board.getBoundingClientRect();
      const x = e.clientX - boardRect.left - 38;
      const y = e.clientY - boardRect.top - 38;
      const el = this.engine.getElement(id);
      if (el) this.createBoardItem(el, x, y);
    });
    
    // Menu
    document.getElementById("btnMenu").addEventListener("click", () => {
      document.querySelector(".app-menu").classList.toggle("open");
    });
    
    // Reset
    document.getElementById("btnReset").addEventListener("click", () => {
      if (confirm("Сбросить весь прогресс?")) {
        this.engine.resetProgress();
        this.board.innerHTML = `
          <div id="hintbar"></div>
          <div id="blackHole">🕳️</div>
          <div id="popup"><div class="card"></div></div>
        `;
        this.boardItems = [];
        this.hintbar = document.getElementById("hintbar");
        this.popup = document.getElementById("popup");
        this.renderPalette();
        this.updateCounter();
      }
    });
    
    // Close menu on outside click
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".menu-wrap")) {
        document.querySelector(".app-menu").classList.remove("open");
      }
    });
  }
}

// ============================================
// HELPER: Add New Elements via Browser Console
// ============================================
// Usage:
//   addElement("neon", "Неон", "💡", "tech", "electricity", "gas", "Инертный газ, светящийся при прохождении тока")
//   addRecipe("fire", "wood", "charcoal")
//
// Then download the updated files:
//   downloadData()
// ============================================

window.addElement = function(id, name, icon, category, ingredientA, ingredientB, clue = "") {
  // Check if element already exists
  if (window.alchemyEngine.elements.has(id)) {
    console.warn(`Element "${id}" already exists!`);
    return false;
  }
  
  // Add element
  const el = { id, name, icon, category, isBase: false, hint: clue, iconType: "emoji" };
  window.alchemyEngine.elements.set(id, el);
  
  // Add recipe
  if (ingredientA && ingredientB) {
    const key = window.alchemyEngine.recipeKey(ingredientA, ingredientB);
    window.alchemyEngine.recipes.set(key, id);
    
    if (!window.alchemyEngine.recipesUsing.has(ingredientA)) {
      window.alchemyEngine.recipesUsing.set(ingredientA, []);
    }
    if (!window.alchemyEngine.recipesUsing.has(ingredientB)) {
      window.alchemyEngine.recipesUsing.set(ingredientB, []);
    }
    window.alchemyEngine.recipesUsing.get(ingredientA).push({ partner: ingredientB, result: id });
    window.alchemyEngine.recipesUsing.get(ingredientB).push({ partner: ingredientA, result: id });
  }
  
  // Add clue if provided
  if (clue) window.alchemyEngine.clues.set(id, clue);
  
  // Auto-discover if both ingredients are discovered
  if (window.alchemyEngine.discovered.has(ingredientA) && window.alchemyEngine.discovered.has(ingredientB)) {
    // Don't auto-discover, let the player craft it
  }
  
  console.log(`✅ Added element: ${name} (${id})`);
  console.log(`   Recipe: ${ingredientA} + ${ingredientB} = ${id}`);
  
  // Update UI
  window.alchemyUI.renderPalette();
  window.alchemyUI.updateCounter();
  
  return true;
};

window.addRecipe = function(a, b, result) {
  const engine = window.alchemyEngine;
  const key = engine.recipeKey(a, b);
  
  if (engine.recipes.has(key)) {
    console.warn(`Recipe ${a} + ${b} already exists (→ ${engine.recipes.get(key)})`);
    return false;
  }
  
  engine.recipes.set(key, result);
  
  if (!engine.recipesUsing.has(a)) engine.recipesUsing.set(a, []);
  if (!engine.recipesUsing.has(b)) engine.recipesUsing.set(b, []);
  engine.recipesUsing.get(a).push({ partner: b, result });
  engine.recipesUsing.get(b).push({ partner: a, result });
  
  console.log(`✅ Added recipe: ${a} + ${b} = ${result}`);
  return true;
};

window.downloadData = function() {
  // Export elements
  const elements = Array.from(window.alchemyEngine.elements.values()).map(el => ({
    id: el.id,
    name: el.name,
    icon: el.icon,
    category: el.category,
    hint: el.hint || "",
    iconType: el.iconType || "emoji",
    isBase: el.isBase || false
  }));
  
  // Export recipes
  const recipes = [];
  const seen = new Set();
  for (const [key, result] of window.alchemyEngine.recipes) {
    const [a, b] = key.split(" ");
    const k = [a, b, result].join("|");
    if (!seen.has(k)) {
      seen.add(k);
      recipes.push([a, b, result]);
    }
  }
  
  const data = {
    elements,
    recipes,
    categories: Array.from(window.alchemyEngine.categories.values()),
    version: "2.0.0"
  };
  
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "alchemy-data-export.json";
  a.click();
  URL.revokeObjectURL(url);
  
  console.log("📥 Data exported! Check your downloads.");
};
